[workspace]
resolver = "3"
members = ["src-tauri", "crates/core", "crates/papers-rs", "crates/papers-rs-cli", "crates/latexenc-rs"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind: a panic of a library (pdf-extract on some PDFs) is caught, not the end of the app
panic = "unwind"
strip = true
