[package]
name = "papers-rs-cli"
version = "0.1.0"
description = "A Rust port of papers-cli: the command line"
authors = ["Alexander Robinson", "Mahé Perrette"]
edition = "2024"
license = "MIT"

[[bin]]
name = "papers-rs"
path = "src/main.rs"

[dependencies]
papers-rs = { version = "0.1.0", path = "../papers-rs" }
serde_json = "1"
clap = { version = "4", default-features = false, features = ["std", "error-context", "string"] }

[dev-dependencies]
tempfile = "3"
flate2 = "1"
libc = "0.2"
