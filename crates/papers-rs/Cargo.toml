[package]
name = "papers-rs"
version = "0.1.0"
description = "A Rust port of papers-cli: the library"
authors = ["Alexander Robinson", "Mahé Perrette"]
edition = "2024"
license = "MIT"

[dependencies]
crc32fast = "1"
flate2 = "1"
# ISC; the data of 0.3.3 is AnyAscii 0.3.3, the table of papers (data/ascii-transliteration.tsv)
any_ascii = "=0.3.3"
latexenc-rs = { version = "0.1.0", path = "../latexenc-rs" }
libc = "0.2"
# the text of a PDF (MIT; on lopdf)
pdf-extract = "0.12"
rapidfuzz = "0.5"
# the network, as the app does it (rustls with ring, the OS certificates), blocking
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
unicode-normalization = "0.1"
