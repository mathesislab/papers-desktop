[package]
name = "papers-rs"
version = "0.1.0"
description = "A Rust port of papers-cli: the library"
authors = ["Alexander Robinson", "Mahé Perrette"]
edition = "2024"
license = "MIT"

[dependencies]
crc32fast = "1"
flate2 = "1"
deunicode = "1"
latexenc-rs = { version = "0.1.0", path = "../latexenc-rs" }
libc = "0.2"
rapidfuzz = "0.5"
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
